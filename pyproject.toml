[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yentlbench"
version = "0.2.0"
description = "Quantifying Sex-Label Attention Leak in LLM Emergency Triage"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Inna Rytsareva", email = "inna@harmonilab.org" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "kaleido>=0.2.1",
    "requests>=2.28.0",
]

[project.scripts]
yentlbench = "yentlbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yentlbench = ["data/*.csv"]
